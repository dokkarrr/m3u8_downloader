name: M3U8 Batch Downloader

on:
  workflow_dispatch:
    inputs:
      playlist_file:
        description: "Playlist .txt filename in repo root (e.g. m3u8files.txt)"
        required: true
        default: "m3u8files.txt"
      quality:
        description: "Stream quality: best | worst | 1080p | 720p"
        required: false
        default: "best"
      workers:
        description: "Concurrent segment download threads"
        required: false
        default: "4"

  push:
    paths:
      - "progress.json"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 349

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests pycryptodome
          fi

      - name: Detect downloader script
        id: detect_script
        run: |
          SCRIPT=$(find . -maxdepth 1 -name "*.py" \
            ! -name "__init__.py" \
            ! -name "resume_runner.py" \
            ! -name "show_status.py" \
            | sort | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "No .py downloader found in repo root."
            exit 1
          fi
          echo "Script detected: $SCRIPT"
          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"

      - name: Detect playlist file
        id: detect_playlist
        run: |
          MANUAL="${{ github.event.inputs.playlist_file }}"
          if [ -n "$MANUAL" ] && [ -f "$MANUAL" ]; then
            echo "Using manual input: $MANUAL"
            echo "playlist=$MANUAL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f progress.json ]; then
            SAVED=$(python3 -c "import json,pathlib; d=json.loads(pathlib.Path('progress.json').read_text()); print(d.get('playlist_file',''))")
            if [ -n "$SAVED" ] && [ -f "$SAVED" ]; then
              echo "Resuming from progress.json: $SAVED"
              echo "playlist=$SAVED" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          TXT=$(find . -maxdepth 1 -name "*.txt" ! -name "requirements.txt" | sort | head -1)
          if [ -z "$TXT" ]; then
            echo "No .txt playlist found in repo root."
            exit 1
          fi
          TXT="${TXT#./}"
          echo "Auto-detected playlist: $TXT"
          echo "playlist=$TXT" >> "$GITHUB_OUTPUT"

      - name: Show current progress
        run: python3 show_status.py "${{ steps.detect_playlist.outputs.playlist }}"
        continue-on-error: true

      - name: Run downloader (resume-aware)
        id: run_dl
        env:
          PLAYLIST:           ${{ steps.detect_playlist.outputs.playlist }}
          SCRIPT:             ${{ steps.detect_script.outputs.script }}
          QUALITY:            ${{ github.event.inputs.quality || 'best' }}
          WORKERS:            ${{ github.event.inputs.workers || '4' }}
          OUTPUT_DIR:         downloads
          TIME_LIMIT_SECONDS: "20700"
        run: |
          python3 resume_runner.py
          EXIT=$?
          echo "runner_exit=$EXIT" >> "$GITHUB_OUTPUT"
          if [ "$EXIT" -eq 2 ]; then
            echo "Timed out cleanly - next run will auto-trigger via progress.json push"
            exit 0
          fi
          exit $EXIT

      - name: List downloaded files
        if: always()
        run: |
          echo "=== downloads/ ==="
          find downloads -type f \( -name "*.mp4" -o -name "*.ts" \) \
            -exec ls -lh {} \; 2>/dev/null | sort || echo "(none yet)"
          echo "=== progress.json ==="
          cat progress.json 2>/dev/null || echo "(none)"

      - name: Upload downloaded videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episodes-run-${{ github.run_number }}
          path: |
            downloads/*.mp4
            downloads/*.ts
          retention-days: 7
          if-no-files-found: warn

      - name: Upload JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-run-${{ github.run_number }}
          path: downloads/*.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit progress.json back to repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json
          if git diff --cached --quiet; then
            echo "progress.json unchanged - nothing to commit."
            exit 0
          fi
          DONE=$(python3 -c "import json,pathlib; d=json.loads(pathlib.Path('progress.json').read_text()); print(len(d.get('completed_urls',[])))" 2>/dev/null || echo "0")
          REM=$(python3 -c "import json,pathlib; d=json.loads(pathlib.Path('progress.json').read_text()); print(d.get('remaining_count',0))" 2>/dev/null || echo "0")
          TIMEDOUT=$(python3 -c "import json,pathlib; d=json.loads(pathlib.Path('progress.json').read_text()); print(d.get('timed_out',False))" 2>/dev/null || echo "False")
          ALLDONE=$(python3 -c "import json,pathlib; d=json.loads(pathlib.Path('progress.json').read_text()); print(d.get('completed',False))" 2>/dev/null || echo "False")
          TOTAL=$((DONE + REM))
          if [ "$ALLDONE" = "True" ]; then
            MSG="chore: ALL DONE ${DONE}/${TOTAL} [run #${{ github.run_number }}]"
          elif [ "$TIMEDOUT" = "True" ]; then
            MSG="chore: progress ${DONE}/${TOTAL} auto-resume [run #${{ github.run_number }}]"
          else
            MSG="chore: progress ${DONE}/${TOTAL} [run #${{ github.run_number }}]"
          fi
          git pull --rebase origin ${{ github.ref_name }} 2>/dev/null || true
          git commit -m "$MSG"
          git push
          echo "progress.json pushed"
