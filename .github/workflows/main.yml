name: M3U8 Batch Downloader

on:
  workflow_dispatch:
    inputs:
      playlist_file:
        description: "Playlist .txt filename in repo root (e.g. m3u8files.txt)"
        required: true
        default: "m3u8files.txt"
      quality:
        description: "Stream quality: best | worst | 1080p | 720p"
        required: false
        default: "best"
      workers:
        description: "Concurrent segment download threads"
        required: false
        default: "4"

  # Auto-retrigger: when progress.json is committed back, this fires the next run
  push:
    paths:
      - "progress.json"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 349

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests pycryptodome
          fi

      - name: Detect downloader script
        id: detect_script
        run: |
          SCRIPT=$(find . -maxdepth 1 -name "*.py" \
            ! -name "__init__.py" \
            ! -name "resume_runner.py" \
            | sort | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "❌ No .py file found in repo root."
            exit 1
          fi
          echo "✅ Script detected: $SCRIPT"
          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"

      - name: Detect playlist file
        id: detect_playlist
        run: |
          MANUAL="${{ github.event.inputs.playlist_file }}"
          if [ -n "$MANUAL" ] && [ -f "$MANUAL" ]; then
            echo "✅ Using manual input: $MANUAL"
            echo "playlist=$MANUAL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f progress.json ]; then
            SAVED=$(python3 -c "import json; d=json.load(open('progress.json')); print(d.get('playlist_file',''))" 2>/dev/null)
            if [ -n "$SAVED" ] && [ -f "$SAVED" ]; then
              echo "✅ Resuming playlist from progress.json: $SAVED"
              echo "playlist=$SAVED" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          TXT=$(find . -maxdepth 1 -name "*.txt" ! -name "requirements.txt" | sort | head -1)
          if [ -z "$TXT" ]; then
            echo "❌ No .txt playlist found in repo root."
            exit 1
          fi
          TXT="${TXT#./}"
          echo "✅ Auto-detected: $TXT"
          echo "playlist=$TXT" >> "$GITHUB_OUTPUT"

      - name: Show current progress status
        run: |
          P="${{ steps.detect_playlist.outputs.playlist }}"
          TOTAL=$(grep -c "https://" "$P" 2>/dev/null || echo "?")
          echo "Playlist : $P  (~$TOTAL URLs)"
          if [ -f progress.json ]; then
            python3 -c "
import json
d = json.load(open('progress.json'))
done = len(d.get('completed_urls', []))
fail = len(d.get('failed_urls', []))
runs = d.get('total_runs', 0)
rem  = d.get('remaining_count', '?')
print(f'  Completed  : {done}')
print(f'  Failed     : {fail}')
print(f'  Remaining  : {rem}')
print(f'  Total runs : {runs}')
"
          else
            echo "  No progress.json — fresh start"
          fi

      # ── CRITICAL: PYEOF must be at column 0, no leading spaces ────────────
      - name: Write resume_runner.py
        run: |
          cat > resume_runner.py << 'PYEOF'
#!/usr/bin/env python3
"""
Resume-aware wrapper.
Reads  : progress.json  (set of already-completed URLs)
Writes : progress.json  (updated after every episode)
Stops  : when TIME_LIMIT_SECONDS is near, saves state cleanly
Exit   : 0=all done  1=errors  2=timed-out(needs next run)
"""
import os, re, sys, json, time, subprocess
from pathlib import Path
from datetime import datetime, timezone

PLAYLIST_FILE      = os.environ["PLAYLIST"]
OUTPUT_DIR         = os.environ.get("OUTPUT_DIR", "downloads")
QUALITY            = os.environ.get("QUALITY", "best")
WORKERS            = os.environ.get("WORKERS", "4")
SCRIPT             = os.environ["SCRIPT"]
PROGRESS_FILE      = "progress.json"
TIME_LIMIT_SECONDS = int(os.environ.get("TIME_LIMIT_SECONDS", str(345 * 60)))

def load_progress():
    if Path(PROGRESS_FILE).exists():
        try:
            return json.loads(Path(PROGRESS_FILE).read_text())
        except Exception:
            pass
    return {
        "playlist_file": PLAYLIST_FILE,
        "quality": QUALITY,
        "completed_urls": [],
        "failed_urls": [],
        "total_runs": 0,
        "last_run": None,
        "completed": False,
    }

def save_progress(state):
    state["last_run"] = datetime.now(timezone.utc).isoformat()
    Path(PROGRESS_FILE).write_text(json.dumps(state, indent=2))
    print(f"\n  Saved progress -> {PROGRESS_FILE}  ({len(state['completed_urls'])} done)")

def parse_urls(filepath):
    raw  = Path(filepath).read_text(encoding="utf-8", errors="replace")
    norm = re.sub(r'\s+#', '\n#', raw)
    norm = re.sub(r'(https?://\S+)', r'\n\1', norm)
    lines = [l.strip() for l in norm.splitlines() if l.strip()]
    entries, current_title = [], None
    for line in lines:
        if line.startswith("#EXTINF"):
            current_title = line.split(",", 1)[1].strip() if "," in line else line
        elif re.match(r'https?://', line) and ".m3u8" in line:
            entries.append((current_title or f"episode_{len(entries)+1:03d}", line))
            current_title = None
    return entries

def clean_title(raw):
    t = re.sub(r'\s*[\[\(][^\]\)]*[\]\)]', '', raw)
    t = re.sub(r'\.m3u8\s*$', '', t, flags=re.IGNORECASE)
    t = re.sub(r'\s+', ' ', t).strip()
    t = re.sub(r'[\\/:*?"<>|]', '', t)
    return t or "episode"

def main():
    start_time = time.time()
    state = load_progress()
    state["total_runs"]    = state.get("total_runs", 0) + 1
    state["playlist_file"] = PLAYLIST_FILE
    state["quality"]       = QUALITY

    completed_urls = set(state.get("completed_urls", []))
    failed_urls    = set(state.get("failed_urls", []))
    all_entries    = parse_urls(PLAYLIST_FILE)
    total          = len(all_entries)
    pending        = [(t, u) for t, u in all_entries if u not in completed_urls]

    print(f"\n  Playlist       : {PLAYLIST_FILE}")
    print(f"  Total URLs     : {total}")
    print(f"  Already done   : {len(completed_urls)}")
    print(f"  This run queue : {len(pending)}")
    print(f"  Time budget    : {TIME_LIMIT_SECONDS//60} min\n")

    if not pending:
        print("  All episodes already downloaded!")
        state["completed"] = True
        state["remaining_count"] = 0
        save_progress(state)
        return 0

    Path(OUTPUT_DIR).mkdir(parents=True, exist_ok=True)
    timed_out   = False
    this_done   = 0
    this_failed = 0

    for idx, (raw_title, url) in enumerate(pending):
        elapsed   = time.time() - start_time
        remaining = TIME_LIMIT_SECONDS - elapsed

        if remaining < 90:
            print(f"\n  Only {remaining:.0f}s left - stopping safely")
            print(f"  Paused at queue item {idx+1}/{len(pending)}")
            timed_out = True
            break

        title   = clean_title(raw_title)
        out_mp4 = Path(OUTPUT_DIR) / f"{title}.mp4"
        out_ts  = Path(OUTPUT_DIR) / f"{title}.ts"

        if (out_mp4.exists() and out_mp4.stat().st_size > 1000) or \
           (out_ts.exists()  and out_ts.stat().st_size  > 1000):
            print(f"  File on disk, marking done: {title}")
            completed_urls.add(url)
            state["completed_urls"] = list(completed_urls)
            save_progress(state)
            continue

        overall = next(i for i,(t,u) in enumerate(all_entries) if u == url) + 1
        print("=" * 68)
        print(f"  [{overall}/{total}]  {title}")
        print(f"  {url[:72]}")
        print(f"  Elapsed {elapsed/60:.1f}min | Remaining {remaining/60:.1f}min")
        print("=" * 68)

        cmd = [
            sys.executable, SCRIPT,
            url,
            "-o", str(out_mp4),
            "-w", WORKERS,
            "-q", QUALITY,
            "--retries", "5",
            "--report",
        ]

        try:
            result = subprocess.run(cmd, timeout=max(remaining - 60, 30))
            if result.returncode == 0:
                completed_urls.add(url)
                this_done += 1
                print(f"\n  Done: {title}")
            else:
                failed_urls.add(url)
                this_failed += 1
                print(f"\n  Failed (exit {result.returncode}): {title}")
        except subprocess.TimeoutExpired:
            print(f"\n  Episode timed out: {title}")
            failed_urls.add(url)
            this_failed += 1
            timed_out = True
        except Exception as e:
            print(f"\n  Error: {e}")
            failed_urls.add(url)
            this_failed += 1

        remaining_count = total - len(completed_urls)
        state["completed_urls"]  = list(completed_urls)
        state["failed_urls"]     = list(failed_urls)
        state["remaining_count"] = remaining_count
        state["completed"]       = (remaining_count == 0)
        state["timed_out"]       = timed_out
        save_progress(state)

        if timed_out:
            break

    remaining_count = total - len(completed_urls)
    state["completed_urls"]  = list(completed_urls)
    state["failed_urls"]     = list(failed_urls)
    state["remaining_count"] = remaining_count
    state["completed"]       = (remaining_count == 0 and not timed_out)
    state["timed_out"]       = timed_out
    save_progress(state)

    elapsed_total = time.time() - start_time
    print("\n" + "=" * 68)
    print("  SESSION SUMMARY")
    print("=" * 68)
    print(f"  Done this run   : {this_done}")
    print(f"  Failed this run : {this_failed}")
    print(f"  Total done      : {len(completed_urls)}/{total}")
    print(f"  Still pending   : {remaining_count}")
    print(f"  Time used       : {elapsed_total/60:.1f} min")
    if timed_out and remaining_count > 0:
        print(f"\n  Auto-resuming next run for {remaining_count} episode(s)...")
    elif state["completed"]:
        print("\n  ALL EPISODES COMPLETE!")
    print()

    if timed_out and remaining_count > 0:
        return 2
    elif failed_urls:
        return 1
    return 0

if __name__ == "__main__":
    sys.exit(main())
PYEOF
          echo "✅ resume_runner.py written successfully"
          echo "--- Verifying file exists and is valid Python ---"
          ls -lh resume_runner.py
          python3 -m py_compile resume_runner.py && echo "✅ Syntax OK"

      - name: Run downloader (resume-aware)
        id: run_dl
        env:
          PLAYLIST:           ${{ steps.detect_playlist.outputs.playlist }}
          SCRIPT:             ${{ steps.detect_script.outputs.script }}
          QUALITY:            ${{ github.event.inputs.quality || 'best' }}
          WORKERS:            ${{ github.event.inputs.workers || '4' }}
          OUTPUT_DIR:         downloads
          TIME_LIMIT_SECONDS: "20700"
        run: |
          python3 resume_runner.py
          EXIT=$?
          echo "runner_exit=$EXIT" >> "$GITHUB_OUTPUT"
          if [ $EXIT -eq 2 ]; then
            echo "Timed out cleanly - next run will auto-trigger"
            exit 0
          fi
          exit $EXIT
        continue-on-error: false

      - name: List downloaded files
        if: always()
        run: |
          echo "--- downloads/ ---"
          find downloads -type f \( -name "*.mp4" -o -name "*.ts" \) \
            -exec ls -lh {} \; 2>/dev/null | sort || echo "(none yet)"
          echo "--- progress.json ---"
          cat progress.json 2>/dev/null || echo "(none)"

      - name: Upload downloaded videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episodes-run-${{ github.run_number }}
          path: |
            downloads/*.mp4
            downloads/*.ts
          retention-days: 7
          if-no-files-found: warn

      - name: Upload JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-run-${{ github.run_number }}
          path: downloads/*.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit progress.json back to repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json
          if git diff --cached --quiet; then
            echo "progress.json unchanged - nothing to commit."
            exit 0
          fi
          DONE=$(python3 -c "import json; d=json.load(open('progress.json')); print(len(d.get('completed_urls',[])))" 2>/dev/null || echo "?")
          TOTAL=$(python3 -c "import json; d=json.load(open('progress.json')); print(len(d.get('completed_urls',[]))+d.get('remaining_count',0))" 2>/dev/null || echo "?")
          TIMEDOUT=$(python3 -c "import json; d=json.load(open('progress.json')); print(d.get('timed_out',False))" 2>/dev/null || echo "False")
          ALLDONE=$(python3 -c "import json; d=json.load(open('progress.json')); print(d.get('completed',False))" 2>/dev/null || echo "False")
          if [ "$ALLDONE" = "True" ]; then
            MSG="chore: ALL DONE ${DONE}/${TOTAL} [run #${{ github.run_number }}]"
          elif [ "$TIMEDOUT" = "True" ]; then
            MSG="chore: progress ${DONE}/${TOTAL} auto-resume [run #${{ github.run_number }}]"
          else
            MSG="chore: progress ${DONE}/${TOTAL} [run #${{ github.run_number }}]"
          fi
          git pull --rebase origin ${{ github.ref_name }} 2>/dev/null || true
          git commit -m "$MSG"
          git push
          echo "✅ progress.json pushed → triggers next run automatically"
