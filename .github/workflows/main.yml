name: M3U8 Batch Downloader

on:
  # Manual trigger with inputs
  workflow_dispatch:
    inputs:
      playlist_file:
        description: "Playlist .txt filename in repo root (e.g. m3u8files.txt)"
        required: true
        default: "m3u8files.txt"
      quality:
        description: "Stream quality: best | worst | 1080p | 720p"
        required: false
        default: "best"
      workers:
        description: "Concurrent segment download threads"
        required: false
        default: "4"

  # Also trigger automatically when any .txt file in root changes
  push:
    paths:
      - "*.txt"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360       # 6-hour cap — adjust if your batch is longer

    steps:
      # ── 1. Checkout repo ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install FFmpeg ────────────────────────────────────────────────────
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      # ── 4. Install Python dependencies ──────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install requests pycryptodome

      # ── 5. Detect .py script automatically (no filename hardcoded) ──────────
      - name: Detect downloader script
        id: detect_script
        run: |
          # Find the first .py file in the repo root (ignores __init__.py etc.)
          SCRIPT=$(find . -maxdepth 1 -name "*.py" ! -name "__init__.py" | sort | head -1)

          if [ -z "$SCRIPT" ]; then
            echo "❌ No .py file found in repository root."
            exit 1
          fi

          echo "✅ Detected script: $SCRIPT"
          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"

      # ── 6. Detect .txt playlist file ─────────────────────────────────────────
      - name: Detect playlist .txt file
        id: detect_playlist
        run: |
          # Priority 1: use the manually provided input (workflow_dispatch)
          MANUAL_INPUT="${{ github.event.inputs.playlist_file }}"

          if [ -n "$MANUAL_INPUT" ] && [ -f "$MANUAL_INPUT" ]; then
            echo "✅ Using manually specified playlist: $MANUAL_INPUT"
            echo "playlist=$MANUAL_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Priority 2: auto-detect — pick the first .txt in repo root
          TXT=$(find . -maxdepth 1 -name "*.txt" | sort | head -1)

          if [ -z "$TXT" ]; then
            echo "❌ No .txt playlist file found in repository root."
            exit 1
          fi

          # Strip leading ./
          TXT="${TXT#./}"
          echo "✅ Auto-detected playlist: $TXT"
          echo "playlist=$TXT" >> "$GITHUB_OUTPUT"

      # ── 7. Show playlist preview ─────────────────────────────────────────────
      - name: Preview playlist file
        run: |
          PLAYLIST="${{ steps.detect_playlist.outputs.playlist }}"
          echo "──────────────── Playlist: $PLAYLIST ────────────────"
          head -40 "$PLAYLIST" || true
          echo "──────────────────────────────────────────────────────"
          TOTAL=$(grep -c "^https\?://" "$PLAYLIST" 2>/dev/null || echo "?")
          echo "URLs found: $TOTAL"

      # ── 8. Patch playlist path & run downloader ───────────────────────────────
      - name: Run downloader
        env:
          PLAYLIST:  ${{ steps.detect_playlist.outputs.playlist }}
          SCRIPT:    ${{ steps.detect_script.outputs.script }}
          QUALITY:   ${{ github.event.inputs.quality || 'best' }}
          WORKERS:   ${{ github.event.inputs.workers || '4' }}
          OUTPUT_DIR: downloads
        run: |
          echo "▶ Script   : $SCRIPT"
          echo "▶ Playlist : $PLAYLIST"
          echo "▶ Quality  : $QUALITY"
          echo "▶ Workers  : $WORKERS"
          echo "▶ Out dir  : $OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          # Run using CLI flags so we never touch the hardcoded paths inside the script
          python "$SCRIPT" \
            --playlist-file "$PLAYLIST" \
            --output-dir    "$OUTPUT_DIR" \
            --quality       "$QUALITY" \
            --workers       "$WORKERS" \
            --retries       5 \
            --report

      # ── 9. List downloaded files ──────────────────────────────────────────────
      - name: List output files
        if: always()
        run: |
          echo "──────────────── Downloaded files ────────────────"
          find downloads -type f \( -name "*.mp4" -o -name "*.ts" \) \
            -exec ls -lh {} \; 2>/dev/null || echo "(none)"

      # ── 10. Upload downloads as artifact ──────────────────────────────────────
      - name: Upload downloaded videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-episodes-${{ github.run_number }}
          path: |
            downloads/*.mp4
            downloads/*.ts
            downloads/*.json
          retention-days: 7        # GitHub keeps artifacts 7 days (free tier)
          if-no-files-found: warn

      # ── 11. Upload JSON reports ───────────────────────────────────────────────
      - name: Upload download reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: download-reports-${{ github.run_number }}
          path: downloads/*.json
          retention-days: 30
          if-no-files-found: ignore
